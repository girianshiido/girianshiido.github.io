name: Préparer les voix de l’Archipel
on:
  push:
    branches: [archipel-preparation-voix]
permissions:
  contents: read
jobs:
  narration:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install piper-tts==1.4.2
      - run: python -m piper.download_voices fr_FR-siwis-medium
      - name: Produire les extraits
        run: python projects/archipel-des-nombres/scripts/prepare-voice.py
