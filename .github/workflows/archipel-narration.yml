name: Enregistrer les consignes des ateliers 0 à 5
on:
  push:
    branches: [archipel-voix-pratique]
permissions:
  contents: read
jobs:
  voix:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      matrix:
        partie: [0, 1]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install piper-tts==1.4.2 imageio-ffmpeg==0.6.0
      - run: python -m piper.download_voices fr_FR-siwis-medium
      - run: python projects/archipel-des-nombres/scripts/make-practice-voice.py ${{ matrix.partie }}
