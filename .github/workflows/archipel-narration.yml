name: Préparer les deux voix françaises de l’Archipel
on:
  push:
    branches: [archipel-deux-voix]
permissions:
  contents: read
jobs:
  choisir:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    outputs:
      lagon: ${{ steps.pitches.outputs.lagon }}
      phare: ${{ steps.pitches.outputs.phare }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install piper-tts==1.4.2 imageio-ffmpeg==0.6.0
      - run: python -m piper.download_voices fr_FR-mls-medium
      - id: pitches
        run: python projects/archipel-des-nombres/scripts/prepare-mls.py choose
  synthese:
    needs: choisir
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    strategy:
      matrix:
        voice: [lagon, phare]
        group: [0, 1, 2]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install piper-tts==1.4.2 imageio-ffmpeg==0.6.0
      - run: python -m piper.download_voices fr_FR-mls-medium
      - name: Générer et vérifier les extraits
        env:
          SPEAKER_ID: ${{ matrix.voice == 'lagon' && needs.choisir.outputs.lagon || needs.choisir.outputs.phare }}
        run: python projects/archipel-des-nombres/scripts/prepare-mls.py ${{ matrix.voice }} "$SPEAKER_ID" ${{ matrix.group }}
