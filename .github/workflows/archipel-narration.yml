name: Vérifier L’Archipel des nombres
on:
  push:
    branches: [archipel-preparation-voix]
permissions:
  contents: read
jobs:
  interface:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    defaults:
      run:
        working-directory: projects/archipel-des-nombres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --no-audit --no-fund
      - run: npm test && npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:interface
      - name: Exporter la version vérifiée
        run: |
          python - <<'PY'
          import base64
          from pathlib import Path
          root = Path('dist')
          for file in [root/'index.html',root/'sw.js',*sorted((root/'assets').iterdir())]:
              payload = file.read_bytes()
              for start in range(0,len(payload),1500):
                  print('ARCHIPEL_DIST',file.relative_to(root),base64.b64encode(payload[start:start+1500]).decode())
          PY
